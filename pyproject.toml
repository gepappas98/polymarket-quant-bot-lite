[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-quant-bot-lite"
version = "0.4.0"
description = "Polymarket quant trading worker and simulation dashboard"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0", "python-dotenv>=1.0.0", "rich>=13.0.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "pydantic>=2.6", "httpx>=0.27", "websockets>=12.0"]

[project.optional-dependencies]
core = ["ccxt>=4.0.0", "requests>=2.31.0", "python-dotenv>=1.0.0", "rich>=13.0.0", "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "pydantic>=2.6", "httpx>=0.27", "websockets>=12.0"]
ml = ["xgboost>=2.0.0"]
kalshi = ["cryptography>=42.0.0"]
metrics = ["prometheus-client>=0.20.0", "psycopg[binary]>=3.1.0", "psycopg_pool>=3.2.0"]
dev = ["pytest>=8.0.0"]
