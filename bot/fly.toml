# Fly.io deployment — https://fly.io
# Docs: https://fly.io/docs/languages-and-frameworks/python/
#
# Deploy:
#   fly launch --no-deploy   # first time (creates app)
#   fly secrets set MODE=paper
#   fly deploy
#
# Live (double opt-in):
#   fly secrets set MODE=live LIVE_TRADING_CONFIRM=I_UNDERSTAND_THE_RISK POLYMARKET_PRIVATE_KEY=0x...

app = "polymarket-quant-bot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MODE = "paper"
  LOG_LEVEL = "INFO"
  ASSETS = "BTC"
  WINDOWS = "5,15"
  MAX_ORDER_USD = "25"
  MAX_MARKET_EXPOSURE_USD = "150"
  ARB_THRESHOLD = "0.985"
  STATUS_PORT = "8080"

[processes]
  # Long-running worker (not HTTP). Scale to 1.
  app = "python -m bot.main"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Exposes bot/status_server.py's JSON endpoint for the dashboard's
# BOT_STATUS_URL (point it at https://<this-app>.fly.dev/status).
[[services]]
  internal_port = 8080
  protocol = "tcp"
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    path = "/health"