# Railway — https://railway.app
# Connect the GitHub repo and set env vars in the dashboard.
# Use the "worker" style process (no public HTTP required).
#
# Optional: set STATUS_PORT (e.g. 8080) in the Railway dashboard and expose
# a public domain pointing at that port to feed the dashboard's BOT_STATUS_URL
# (GET /status).

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = "python -m bot.main"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10